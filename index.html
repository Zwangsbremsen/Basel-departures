<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextTrain CH</title>
  <link rel="stylesheet" href="style.css">
   
</head>
<body>
  <h1>NextTrain CH</h1>

  <form id="search-form">
  <input id="station-input" type="text" value="Basel SBB">
  <button type="submit">Find departures</button>
  </form>
  <button type="button" id="fav-btn" hidden>Save station as favorite</button>
  <h2>Favorites</h2>
  <ul id="Favorites"></ul>

  <form id="auth-form">
    <input id="email" type="email" placeholder="Email" required>
    <input id="password" type="password" placeholder="Password (min. 8 characters)" required minlength="8">
    <button type="submit">Log in</button>
    <button type="button" id="register-btn">Register</button>
    <button type="button" id="logout-btn">Log out</button>
  </form>
  <button type="button" id="fav-btn" hidden>Save station as favorite</button>
  <h2>Favorites</h2>
  <ul id="Favorites"></ul>

  <p id="status"></p>
  <p id="auth-status"></p>
  <table>
    <thead>
      <tr>
        <th>Time</th>
        <th>Line</th>
        <th>Destination</th>
        <th>Platform</th>
      </tr>
    </thead>
    <tbody id="board">
      <tr>
        <td>12:34</td>
        <td>IC3</td>
        <td>Zürich HB</td>
        <td>7</td>
      </tr>
    </tbody>
  </table>
    <script src="app.js"></script>
</body>
</html>
